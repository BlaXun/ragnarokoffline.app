  - Profile: novice_default
    Jobs:
      Novice: novice_set
    BaseLevel: [1, 12]
    JobLevel: [1, 10]
    NameProfile: default
    ChatProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: wander
    FieldBehavior: combat

  - Profile: combat_pve           # mid and late maps: 2nd classes the pve_* profiles do not claim
