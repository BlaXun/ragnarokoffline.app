# Population Vendors Database — import stub.
#
# Copied into db/import by `make import`, the same way rAthena's own stubs are,
# so db/population_vendors.yml can import db/import/population_vendors.yml
# unconditionally. An import that names a file which is not there is an error on
# every start, which is what this empty stub prevents when no mod ships vendors.
#
# A mod's db/population_vendors.yml replaces this file. Its VendorKey entries are
# added to the shipped table; a repeat of the same VendorKey overrides it. Each
# entry may carry a VendorPlacement, and several vendors can share a map (each at
# its own spot). See the shipped db/population_vendors.yml for the full schema.

Header:
  Type: POPULATION_VENDORS_DB
  Version: 1

