[package]
name = "ragnarok-stack"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Bring the Ragnarok Offline server stack up or down inside nebula's microVM"

# No dependencies, deliberately. This is a process supervisor: it spawns
# docker-slim and nebula, moves files, and waits. std covers all of it, the
# build stays under a minute on every runner, and there is no dependency tree
# to audit in something that ships inside a signed app bundle.
[dependencies]

[[bin]]
name = "ragnarok-stack"
path = "src/main.rs"

# Tests run the app's own SHA-256, PBKDF2 and zlib, which are many times
# slower unoptimised. Level 1 costs a few seconds of compile and saves more.
[profile.test]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
