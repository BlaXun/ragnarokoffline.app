# companion-tactics: how recruited companions fight, per monster and per job.
# Reference: docs/mods/companion-strategies.md

Header:
  Type: POPULATION_STRATEGY_DB
  Version: 1

Body:
  # --- Every fight -----------------------------------------------------------
  - Mob: All
    Jobs:
      - Job: Priest
        Rules:
          # A party member is about to take a Stun Attack: wall them before it lands.
          - Name: wall_the_stunned
            Priority: 80
            On: { Event: monster_casts, Skill: NPC_STUNATTACK, At: party }
            Cast: MG_SAFETYWALL
            Target: event
            OnePerParty: true
          # Anyone in the party can ask for a wall in party chat.
          - Name: wall_on_request
            Priority: 70
            On: { Event: party_chat, Match: "wall me" }
            Cast: MG_SAFETYWALL
            Target: event
            Say: "Wall on {ally}!"
          # The engine already revives the dead; this only says so.
          - Name: announce_rez
            On: party_member_died
            Target: event
            Say: "{ally} is down, coming!"
          # Keep Blessing on whoever tanks.
          - Name: bless_the_tank
            Priority: 30
            Cast: AL_BLESSING
            Target: { Ally: missing, Status: SC_BLESSING, Role: tank }

      # A Sage that sees a Storm Gust coming lays Land Protector at its feet and calls
      # the party to it; everyone else comes when called.
      - Job: Sage
        Rules:
          - Name: lp_for_the_group
            Priority: 90
            On: { Event: casts, Skill: WZ_STORMGUST }
            Cast: SA_LANDPROTECTOR
            Target: self
            Signal: on_me
            Say: "On me!"

      # Casters stand on a party member's Land Protector, safe from ground spells,
      # and cast nothing at a monster that reflects magic back.
      - Job: Wizard
        Start: normal
        Strategies:
          - Name: normal
            Rules:
              - Name: mirror_up
                When: enemy_magicmirror
                Switch: mirrored
                Say: "It reflects magic, holding my spells."
          - Name: mirrored
            Rotation: false
            Rules:
              - Name: mirror_down
                When: not_enemy_magicmirror
                Switch: normal
        Rules:
          - Name: lp_incoming
            Priority: 85
            On: { Event: casts, By: party, Skill: SA_LANDPROTECTOR }
            MoveTo: event_cell
          - Name: onto_lp          # and stays on it: following waits while it holds
            Priority: 84
            MoveTo: { Field: SA_LANDPROTECTOR, Owner: party, Within: 8 }

      # Everyone steps out of a monster's ground spell: Storm Gust, Meteor Storm, a trap,
      # and comes when a companion calls.
      - Job: All
        Rules:
          - Name: gather
            Priority: 88
            On: { Event: signal, Name: on_me }
            MoveTo: event
          # Never hit a boss from where it cannot fight back: that makes most of them teleport.
          - Name: no_rude_attack
            Priority: 98
            Enemy: { Boss: true }
            Reach: false
            MoveTo: reachable
          - Name: no_rude_attack_hold
            Priority: 97
            Enemy: { Boss: true }
            Reach: false
            Hold: true
          # A boss that teleported away: one says so, everyone regroups on the owner.
          - Name: boss_gone_say
            Priority: 97
            On: { Event: encounter_ended, Reason: vanished }
            Say: "It teleported, back to you, {owner}."
            OnePerParty: true
          - Name: boss_gone_regroup
            Priority: 96
            On: { Event: encounter_ended, Reason: vanished }
            Retreat: owner
          # A tank provokes what is hitting someone else, the support first, and keeps it.
          - Name: peel
            Priority: 80
            Requires: { Role: tank }
            Cast: SM_PROVOKE
            Target: { Enemy: attacking, Who: party, NotSelf: true, Prefer: support }
            When: not_enemy_provoke
            SetTarget: true
            OnePerParty: true
          # Attackers go for the boss, not its slaves.
          - Name: focus_boss
            Priority: 10
            Requires: { Role: attacker }
            Target: { Enemy: boss, Range: 12 }
            SetTarget: true
          - Name: leave_hostile_ground
            Priority: 99
            Leave: { Owner: monster }

  # --- Stalactic Golem: high defence (pre-renewal 50, renewal 230), a 1.5 s Stun
  #     Attack, and Endure and Auto Guard when hit from range. Encounter: the plan
  #     applies while one is near, so a Priest with no target still plays its part.
  - Mob: STALACTIC_GOLEM
    Encounter: true
    Jobs:
      # Every Monk and Champion (a Champion uses its base class's entries).
      - Job: Monk
        Ban: [MO_FINGEROFFENSIVE]    # ranged hits trigger its Endure and Auto Guard
        Rules:
          - Name: dodge_stun
            Priority: 100
            On: { Event: casts, Skill: NPC_STUNATTACK, At: self }
            Retreat: away
            Distance: 3

      # Asura, Monk or Champion. Investigate does more the higher the defence, so it
      # carries the fight; Asura finishes it. Fury costs 5 spheres and Asura 5 more,
      # so the spheres are charged again after Fury. A Champion recharges with Zen
      # (5 at once) and strikes Asura straight out of Combo Finish or Chain Crush,
      # where it has no cast time and needs fewer spheres.
      - Job: Monk
        Build: asura
        Requires: { Skills: [MO_EXTREMITYFIST] }
        Start: approach
        Rules:
          - Name: too_hurt
            Priority: 90
            When: self_hp_pct_lt35
            Switch: recover
          - Name: zen                 # Champion: 5 spheres at once
            Priority: 15
            When: [self_spheres_lt5, not_self_combo]
            Cast: CH_SOULCOLLECT
          - Name: call_spirits        # Monk: one at a time
            Priority: 14
            Requires: { Lacks: [CH_SOULCOLLECT] }
            When: [self_spheres_lt5, not_self_combo]
            Cast: MO_CALLSPIRITS
        Strategies:
          - Name: approach            # it is slow: arrive charged
            Rules:
              - Name: engage
                When: [enemy_distance_le2, self_spheres_ge5]
                Switch: fight
          - Name: fight
            Rules:
              - Name: go_finish
                Priority: 30
                When: [enemy_hp_pct_lt30, self_sp_pct_ge80]
                Switch: finish
              - Name: investigate
                Priority: 20
                When: self_spheres_ge2   # keep one for the next Investigate's charge
                Cast: MO_INVESTIGATE
          - Name: finish              # Fury, charge again, then Asura
            Rotation: false           # plain hits: a Champion's combo starts from Triple Attack
            Rules:
              - Name: asura_combo     # out of Combo Finish or Chain Crush: no cast time
                Priority: 50
                When: [self_combo, self_explosionspirits]
                Cast: MO_EXTREMITYFIST
                Say: "Asura Strike!"
                Switch: fight
              - Name: chain_crush
                Priority: 45
                When: [self_combo, self_explosionspirits]
                Cast: CH_CHAINCRUSH
              - Name: combo_finish
                Priority: 44
                When: [self_combo, self_explosionspirits, self_spheres_ge5]
                Cast: MO_COMBOFINISH
              - Name: chain_combo
                Priority: 43
                When: [self_combo, self_explosionspirits, self_spheres_ge5]
                Cast: MO_CHAINCOMBO
              - Name: fury
                Priority: 30
                When: [self_spheres_ge5, not_self_explosionspirits]
                Cast: MO_EXPLOSIONSPIRITS
              - Name: asura            # a Monk without combos: the plain cast
                Priority: 10
                Requires: { Lacks: [MO_COMBOFINISH] }
                When: [self_explosionspirits, self_spheres_ge5, not_self_combo]
                Cast: MO_EXTREMITYFIST
                Say: "Asura Strike!"
                Switch: fight
              - Name: abort            # cannot pay for Asura any more
                When: self_sp_pct_lt60
                Switch: fight
          - Name: recover
            Rules:
              - Name: steel_body
                Priority: 20
                When: [self_spheres_ge5, not_self_steelbody]
                Cast: MO_STEELBODY
              - Name: call_for_help
                Priority: 10
                Say: "{owner}, I need healing!"
                Cooldown: 8000
              - Name: recovered
                When: self_hp_pct_gt70
                Switch: approach

      # A combo Monk or Champion without Asura: plain hits open the combo (Triple
      # Attack); rAthena accepts each step only right after the one before it, so the
      # steps are listed last first and a step out of order is simply refused. Combo
      # damage is weapon damage, so this golem's defence hurts it more than Investigate.
      - Job: Monk
        Build: combo
        Requires: { Skills: [MO_CHAINCOMBO], Lacks: [MO_EXTREMITYFIST] }
        Rotation: false
        Start: approach
        Strategies:
          - Name: approach
            Rules:
              - Name: zen
                Priority: 2
                When: [not_self_combo, self_spheres_lt5]
                Cast: CH_SOULCOLLECT
              - Name: charge
                Priority: 1
                Requires: { Lacks: [CH_SOULCOLLECT] }
                When: [not_self_combo, self_spheres_lt5]
                Cast: MO_CALLSPIRITS
              - Name: engage
                When: enemy_distance_le2
                Switch: fight
          - Name: fight
            Rules:
              - Name: hurt
                Priority: 50
                When: self_hp_pct_lt30
                Retreat: owner
                Say: "{owner}, heal me!"
              - Name: chain_crush
                Priority: 40
                When: self_combo
                Cast: CH_CHAINCRUSH
              - Name: glacier_fist
                Priority: 39
                When: self_combo
                Cast: CH_TIGERFIST
              - Name: combo_finish
                Priority: 38
                When: [self_combo, self_spheres_ge1]
                Cast: MO_COMBOFINISH
              - Name: chain_combo
                Priority: 37
                When: self_combo
                Cast: MO_CHAINCOMBO
              # Between combos, keep at least 2 spheres, or Chain Combo cannot lead on.
              - Name: investigate_opener   # a spare sphere goes on the defence-hungry hit
                Priority: 25
                When: [not_self_combo, self_spheres_ge4]
                Cast: MO_INVESTIGATE
              - Name: zen
                Priority: 20
                When: [not_self_combo, self_spheres_lt2]
                Cast: CH_SOULCOLLECT
              - Name: refill
                Priority: 10
                Requires: { Lacks: [CH_SOULCOLLECT] }
                When: [not_self_combo, self_spheres_lt2]
                Cast: MO_CALLSPIRITS

      # A magic Ninja: stand in the middle of its own ring of fire (Blaze Shield is
      # 24 pillars in a 5x5 ring around the caster), let the golem walk through it,
      # then Exploding Dragon. Its Flame Stones are marked Consume; catalysts are not paid
      # until companions have an inventory of their own.
      - Job: Ninja
        Build: magic
        Requires: { Skills: [NJ_KAENSIN, NJ_BAKUENRYU], Lacks: [NJ_ISSEN] }
        Rotation: false
        Start: prepare
        Rules:
          - Name: cicada
            Priority: 90
            Charges: { Status: SC_UTSUSEMI, Below: 2 }
            Cast: NJ_UTSUSEMI
        Strategies:
          - Name: prepare
            Rules:
              - Name: blaze
                Priority: 95
                Cast: NJ_KAENSIN
                Consume: true
                Switch: pull
          - Name: pull
            Rules:
              - Name: spear
                Cast: NJ_HYOUSENSOU
                Level: 1
                Switch: hold
          - Name: hold
            Rules:
              - Name: dragon
                Priority: 20
                When: [self_targeted, enemy_distance_le2]
                Cast: NJ_BAKUENRYU
                Consume: true
                Switch: after_dragon
              - Name: wait
                Hold: true
          - Name: after_dragon
            Rules:
              - Name: drag_again
                Priority: 30
                When: enemy_hp_pct_lt30
                Field: { Skill: NJ_KAENSIN, AtLeast: 4 }
                Retreat: away
                Distance: 3
                Switch: hold
              - Name: ring_gone
                Priority: 20
                Field: { Skill: NJ_KAENSIN, Below: 1 }
                Switch: prepare
              - Name: again
                Priority: 10
                When: enemy_hp_pct_ge30
                Switch: hold
              - Name: wait
                Hold: true

      # The duo: a Final Strike Ninja and a Priest. Final Strike hits for the Ninja's
      # CURRENT HP (pre-renewal 40*STR + HP*8*lv/100) and leaves it at 1 HP (1 % in
      # renewal), ending Soul. So: Soul first, then a full bar, a shield (Kyrie from
      # the Priest, or Cicada), strike, back off while the Priest heals it full, again.
      - Job: Ninja
        Build: final_strike
        Requires: { Skills: [NJ_ISSEN] }
        Rotation: false               # no thrown kunai: ranged hits set off Endure and Auto Guard
        Start: prepare
        Rules:
          - Name: cicada
            Priority: 90
            Charges: { Status: SC_UTSUSEMI, Below: 2 }
            Cast: NJ_UTSUSEMI
        Strategies:
          - Name: prepare
            Rules:
              - Name: soul             # costs HP, so before the bar is filled
                Priority: 40
                When: not_self_nen
                Cast: NJ_NEN
              - Name: ask_for_kyrie
                Priority: 30
                When: self_hp_pct_ge90
                Signal: kyrie_me
                Cooldown: 6000
              - Name: strike
                Priority: 50
                When:
                  AND: [self_hp_pct_ge95, enemy_distance_le1]
                  OR: [self_kyrie, self_utsusemi]
                Cast: NJ_ISSEN
                Signal: struck
                Switch: recover
          - Name: recover              # at 1 HP: away from the slow golem until healed
            Rules:
              - Name: back_off
                Priority: 50
                KeepDistance: 5
              - Name: healed
                Priority: 60
                When: self_hp_pct_ge90
                Switch: prepare

      - Job: Priest
        Rules:
          - Name: heal_the_striker     # it is at 1 HP the moment it struck
            Priority: 95
            On: { Event: signal, Name: struck, Within: 2000 }
            Target: event
            Cast: AL_HEAL
          - Name: kyrie_for_the_strike
            Priority: 90
            On: { Event: signal, Name: kyrie_me, Within: 4000 }
            Target: event
            When: not_ally_kyrie
            Cast: PR_KYRIE
          - Name: heal_up
            Priority: 80
            Cast: AL_HEAL
            Target: { Ally: lowest_hp }
            When: ally_hp_pct_lt90
          - Name: stay_back            # the golem is melee and slow
            Priority: 20
            KeepDistance: 4

  # --- Phreeoni: the first playtest. A Wizard, a Priest and an Assassin beside their
  #     owner. Its escort: 10 Hodes on spawn, 6 Sandmen (earth) whenever 3 or fewer are
  #     left (a 0.7 s cast). Below 80 % HP: Wide Stone Curse every 20 s (0.5 s cast, 14
  #     cells: it cannot be outrun). Below 50 %: heals itself. Below 30 %: Power Up.
  #     Below 20 %: Hiding, healing while hidden. Hit by Fire Wall: Heaven's Drive and
  #     Helm Break. Hit from where it cannot reach: teleports away.
  #
  #     Encounter: the plan applies while Phreeoni is near, whatever each companion is
  #     fighting -- the Priest heals with no target at all, the Wizard fights the slaves.
  #     One plan for all three jobs: a Cast rule only exists for a companion that knows
  #     the skill, so each rule finds its own job. The phases are its strategies.
  - Mob: PHREEONI
    Encounter: true
    Jobs:
      - Job: All
        Ban: [MG_FIREWALL]            # Fire Wall sets off Heaven's Drive and Helm Break
        Start: opening
        Rules:                        # every phase
          # It hides below 20 %, and heals while hidden: find it at once.
          - Name: reveal_ruwach
            Priority: 100
            When: enemy_hidden
            Cast: AL_RUWACH
          - Name: reveal_sight
            Priority: 99
            When: [enemy_hidden, not_self_sight]
            Cast: MG_SIGHT
          # Wide Stone Curse cannot be dodged; undo it.
          - Name: unstone
            Priority: 95
            Cast: PR_STRECOVERY
            Target: { Ally: having, Status: SC_STONE }
          - Name: heal_low
            Priority: 90
            Cast: AL_HEAL
            Target: { Ally: lowest_hp }
            When: ally_hp_pct_lt55
          # New slaves: AoE them on the boss as they arrive. Fire hurts earth Sandmen most.
          - Name: meteor_the_slaves
            Priority: 85
            On: { Event: casts, Skill: NPC_SUMMONSLAVE, Within: 4000 }
            Cast: WZ_METEOR
            Target: source
          - Name: storm_the_slaves
            Priority: 84
            Requires: { Lacks: [WZ_METEOR] }
            On: { Event: casts, Skill: NPC_SUMMONSLAVE, Within: 4000 }
            Cast: WZ_STORMGUST
            Target: source
          # Instant Call Slave brings them back around it with no warning: AoE once three are there.
          - Name: meteor_the_pack
            Priority: 83
            Target: { Enemy: boss }
            Count: { Enemy: slaves, Around: target, Range: 5, AtLeast: 3 }
            Cast: WZ_METEOR
            Cooldown: 8000
          # Slaves on the Priest: one attacker takes them off.
          - Name: guard_the_priest
            Priority: 80
            Requires: { Role: attacker }
            Target: { Enemy: attacking, Who: support }
            SetTarget: true
            OnePerParty: true
          - Name: lex
            Priority: 40
            Cast: PR_LEXAETERNA
            Target: { Enemy: boss }
            When: not_enemy_aeterna
            OnePerParty: true
        Strategies:
          - Name: opening             # above 80 %
            Rules:
              - Name: kyrie_the_hurt
                Priority: 60
                Cast: PR_KYRIE
                Target: { Ally: lowest_hp }
                When: [ally_hp_pct_lt85, not_ally_kyrie]
              - Name: to_stone
                Target: { Enemy: boss }
                When: enemy_hp_pct_lt80
                Switch: stone
                Say: "It's at 80%, petrify from here on."

          - Name: stone               # 80 % down to 30 %: Wide Stone Curse every 20 s
            Rules:
              - Name: warn_stone
                Priority: 70
                On: { Event: casts, Skill: NPC_WIDESTONE }
                Say: "Wide Stone!"
              - Name: kyrie_the_hurt
                Priority: 60
                Cast: PR_KYRIE
                Target: { Ally: lowest_hp }
                When: [ally_hp_pct_lt85, not_ally_kyrie]
              - Name: to_last
                Target: { Enemy: boss }
                When: enemy_hp_pct_lt30
                Switch: last
                Say: "Below 30%: it powers up, then hides. Burst!"

          - Name: last                # below 30 %: Power Up, then Hiding below 20 %
            Rules:
              - Name: warn_stone
                Priority: 70
                On: { Event: casts, Skill: NPC_WIDESTONE }
                Say: "Wide Stone!"
              - Name: assumptio_the_hurt
                Priority: 65
                Cast: HP_ASSUMPTIO
                Target: { Ally: lowest_hp }
                When: not_ally_assumptio
              - Name: kyrie_the_hurt
                Priority: 60
                Cast: PR_KYRIE
                Target: { Ally: lowest_hp }
                When: not_ally_kyrie

  # --- Trash: plain hits only, no SP spent -------------------------------------
  - Mobs: [PORING, DROPS, POPORING, MARIN, FABRE, PUPA]
    Jobs:
      - Job: All
        Rotation: false
