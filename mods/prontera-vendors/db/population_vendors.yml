###########################################################################
# prontera-vendors — vendor definitions
# GENERATED by tools/build_vendors.py from rAthena's item, monster and
# spawn databases and iRO market prices. Edit by hand if you like, but a
# re-run overwrites this file; lasting changes belong in the script.
###########################################################################
#
# One Pool vendor per theme. Each stall draws PickCount items from its Pool
# with prices rolled inside each item's [min, max] (sometimes just under the
# cheapest rival stall, never below the NPC sell price), and on a rare
# 1-in-5000 per item lists one with a digit missing.
#
# Every theme spawns on both Prontera sidewalks. Count is the theme's share
# of the mod's "Vendors" setting, which the mod's script hands to the
# engine; rotation and callouts come from the settings too, and the values
# here are what applies without them.
###########################################################################

Header:
