###########################################################################
# prontera-vendors — vendor definitions
###########################################################################
#
# Two Pool-type vendors, each pinned to its own spot on the west sidewalk.
# The engine draws PickCount items from each Pool at spawn, rotates the shell
# every RotationHours ± RotationJitterMinutes, and refills with a fresh pick +
# title + name. Each vendor is bound to its own placement by VendorKey, so they
# stand at different spots and never get swapped for one another.
#
# Each vendor needs a matching Profile in population_vendor_pop.yml (the shell's
# job/appearance). The Profile's job maps the shell to this VendorKey:
#   pv_general_gear  -> Merchant   (profile pv_general_gear_vendor)
#   pv_forge_supplies-> Alchemist  (profile pv_forge_supplies_vendor)
#
# Prices are tuned to iRO Valkyrie player-market data (ragnastats.com). That is
# a high-zeny economy, so some values are steep for a solo/low-pop world
# (Elunium ~263k, Oridecon ~61k). To soften that, scale the Price numbers down
# (they are plain zeny and easy to edit). Each shell also rolls PriceJitterPct
# around the base and, PriceMistakeOneIn of the time, drops a digit for a rare
# "fat-finger" bargain.
###########################################################################

Header:
  Type: POPULATION_VENDORS_DB
  Version: 1

Body:
  - VendorKey: pv_general_gear
    Type: Pool
    # Fallback if TitleFromPool is empty for some reason.
    Title: "Reska's Odds & Ends"
    # Shell picks one of these per spawn, so each respawn reads as a different player.
    TitleFromPool:
      - "wts potz n stuff fs"
      - "cheap gear, bargains"
      - "fresh wares, come in"
      - "stocked up, buy now"
      - "wts materials cheap"
      - "AFK vending <3"
      - "wts random stuff fs"
      - "junk n jewels"
      - "clearing stash, buy"
      - "Reska's Shop"
    MaxSlots: 10
    PickCount: [6, 10]
    RotationHours: 4
    RotationJitterMinutes: 30
    # Each shell rolls each price ±12% and, 1-in-5000 per item, drops a digit
    # (a "fat-finger" deal). See the header note on prices.
    PriceJitterPct: 12
    PriceMistakeOneIn: 5000
    # Prices tuned to iRO Valkyrie player-market data (ragnastats.com). Items
    # with no player market (Knife, Sword) and base gear whose market average is
    # distorted by slotted/refined variants (Buckler, Cotton Shirt, Sandals,
    # Hood) keep sensible hand-set values instead.
    Pool:
      - { Item: Red_Potion,         Amount: 500, Price: 50 }
      - { Item: Orange_Potion,      Amount: 300, Price: 170 }
      - { Item: Yellow_Potion,      Amount: 200, Price: 430 }
      - { Item: White_Potion,       Amount: 100, Price: 1000 }
      - { Item: Blue_Potion,        Amount: 100, Price: 5000 }
      - { Item: Wing_Of_Fly,        Amount: 200, Price: 55 }
      - { Item: Wing_Of_Butterfly,  Amount: 100, Price: 270 }
      - { Item: Awakening_Potion,   Amount: 50,  Price: 1300 }
      - { Item: Center_Potion,      Amount: 50,  Price: 700 }
      - { Item: Knife,              Amount: 1,   Price: 500 }
      - { Item: Sword,              Amount: 1,   Price: 1500 }
      - { Item: Buckler,            Amount: 1,   Price: 2000 }
      - { Item: Cotton_Shirt,       Amount: 1,   Price: 300 }
      - { Item: Sandals,            Amount: 1,   Price: 400 }
      - { Item: Hood,               Amount: 1,   Price: 500 }
      - { Item: Jellopy,            Amount: 300, Price: 450 }
      - { Item: Fluff,              Amount: 200, Price: 850 }
      - { Item: Clover,             Amount: 100, Price: 100 }
      - { Item: Phracon,            Amount: 100, Price: 650 }
      - { Item: Emveretarcon,       Amount: 50,  Price: 900 }
      - { Item: Elunium,            Amount: 20,  Price: 263000 }
      - { Item: Oridecon,           Amount: 20,  Price: 61000 }
    VendorPlacement:
      Map: prontera
      MinSpacing: 2
      MaxVendors: 1
      # North half of the west-sidewalk strip. Second vendor takes the south half.
      Area: { X1: 147, Y1: 136, X2: 147, Y2: 152 }

  - VendorKey: pv_forge_supplies
    Type: Pool
    Title: "Forge Supplies"
    TitleFromPool:
      - "ores n elu fs"
      - "wts forging mats"
      - "oridecon elunium cheap"
      - "upgrade mats here"
      - "smith supplies fs"
      - "stones n ores"
      - "Garrett's Forge Goods"
    MaxSlots: 8
    PickCount: [5, 8]
    RotationHours: 4
    RotationJitterMinutes: 30
    PriceJitterPct: 12
    PriceMistakeOneIn: 5000
    # Prices tuned to iRO Valkyrie player-market data (ragnastats.com); these
    # materials all trade cleanly there.
    Pool:
      - { Item: Phracon,       Amount: 200, Price: 650 }
      - { Item: Emveretarcon,  Amount: 100, Price: 900 }
      - { Item: Oridecon,      Amount: 30,  Price: 61000 }
      - { Item: Elunium,       Amount: 30,  Price: 263000 }
      - { Item: Steel,         Amount: 300, Price: 6200 }
      - { Item: Iron,          Amount: 500, Price: 3570 }
      - { Item: Iron_Ore,      Amount: 500, Price: 1850 }
      - { Item: Coal,          Amount: 200, Price: 5100 }
      - { Item: Flame_Heart,   Amount: 50,  Price: 17400 }
      - { Item: Mistic_Frozen, Amount: 50,  Price: 26600 }
      - { Item: Rough_Wind,    Amount: 50,  Price: 10800 }
      - { Item: Great_Nature,  Amount: 50,  Price: 6900 }
    VendorPlacement:
      Map: prontera
      MinSpacing: 2
      MaxVendors: 1
      # South half of the same strip, non-overlapping with pv_general_gear.
      Area: { X1: 147, Y1: 155, X2: 147, Y2: 170 }
