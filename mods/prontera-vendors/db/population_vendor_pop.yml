###########################################################################
# prontera-vendors — vendor shell profiles
###########################################################################
#
# One Profile per vendor. Each Profile's job maps the spawned shell to a
# VendorKey, and the engine spawns it at that key's VendorPlacement. The two
# vendors use DIFFERENT jobs on purpose: the vendor job -> VendorKey map is
# global and last-profile-wins, so two profiles on the same job would collide.
#   Merchant   -> pv_general_gear   (also overrides the engine's field_drops Merchant)
#   Alchemist  -> pv_forge_supplies
# Both are merchant-tree classes, so para_merchant gear fits and they read as
# merchants in game.
#
# Jobs:/GearSet references and NameProfile reuse what the population engine
# already ships (para_merchant GearSet, default NameProfile). The important
# bits are TownBehavior: vendor and the VendorKey pointer.
###########################################################################

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

Body:
  - Profile: pv_general_gear_vendor
    Jobs:
      Merchant: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKey: pv_general_gear
    Script: |
      setcart;

  - Profile: pv_forge_supplies_vendor
    Jobs:
      Alchemist: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKey: pv_forge_supplies
    Script: |
      setcart;
