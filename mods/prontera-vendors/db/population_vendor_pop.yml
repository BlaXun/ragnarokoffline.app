###########################################################################
# prontera-vendors — vendor shell profiles
###########################################################################
#
# One Profile per vendor. `PlacementBound: true` makes the engine find the
# profile by its VendorKey, NOT through the global job map, so the Jobs: entry
# is purely the shell's sprite. Our vendors can share a job with each other,
# with other mods' vendors or with the engine's own (field_drops,
# dungeon_drops), and none of those change.
#
# The sprites are real can-vend jobs (the Merchant tree and Super/Hyper Novice
# can open a vend; the engine grants vending to any shell, but a can-vend sprite
# keeps the illusion): Merchant for general goods, Whitesmith for the forge.
#
# NameProfile/GearSet reuse what the engine ships (para_merchant, default). The
# load-bearing bits are TownBehavior: vendor, VendorKey and PlacementBound.
###########################################################################

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

Body:
  - Profile: prontera-vendors/general_gear_vendor
    # Merchant — the classic vendor sprite.
    PlacementBound: true
    Jobs:
      Merchant: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKey: prontera-vendors/general_gear
    Script: |
      setcart;

  - Profile: prontera-vendors/forge_supplies_vendor
    # Whitesmith — reads as a smith, fitting an ores/forge stall.
    PlacementBound: true
    Jobs:
      Whitesmith: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKey: prontera-vendors/forge_supplies
    Script: |
      setcart;
