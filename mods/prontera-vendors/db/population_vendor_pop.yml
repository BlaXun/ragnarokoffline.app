###########################################################################
# prontera-vendors — vendor shell profiles
###########################################################################
#
# One Profile per vendor. `PlacementBound: true` makes the engine resolve the
# shell from the VendorPlacement's VendorKey, NOT from the global job map — so
# the Jobs: entry is purely the shell's sprite. That means:
#   * Several vendors (even across different mods) can use the same sprite job
#     without colliding — the one-job-per-vendor limit is gone.
#   * Our vendors never steal a job from the engine's own field_drops/
#     dungeon_drops, which keep all of theirs and run untouched. This mod is
#     fully self-contained.
# We still use real can-vend sprites (Merchant tree + Super Novice can open a
# vend; the engine force-grants vending to any shell, but a can-vend sprite
# keeps the illusion): Merchant for general goods, Whitesmith (a smith) for the
# forge stall.
#
# NameProfile/GearSet reuse what the engine ships (para_merchant, default). The
# load-bearing bits are TownBehavior: vendor, VendorKey, and PlacementBound.
###########################################################################

Header:
  Type: POPULATION_ENGINE_DB
  Version: 2

Body:
  - Profile: pv_general_gear_vendor
    # Merchant — the classic vendor sprite. PlacementBound, so it does NOT take
    # Merchant from the engine's field_drops; that vendor keeps all its jobs.
    PlacementBound: true
    Jobs:
      Merchant: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKey: pv_general_gear
    Script: |
      setcart;

  - Profile: pv_forge_supplies_vendor
    # Whitesmith — reads as a smith, fitting an ores/forge stall. PlacementBound,
    # so it does NOT take Whitesmith from the engine's dungeon_drops.
    PlacementBound: true
    Jobs:
      Whitesmith: para_merchant
    NameProfile: default
    Hair: [0, 42]
    HairColor: [0, 131]
    ClothesColor: [0, 699]
    Flags:
      - mortal
    TownBehavior: vendor
    VendorKey: pv_forge_supplies
    Script: |
      setcart;
