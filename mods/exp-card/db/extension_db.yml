# Enable the rAthena extension the mod needs.
#
# The mod's bonus drop (see npc/exp_card.txt, OnNPCKillEvent) uses the
# `makeitemowned` script command from the makeitem_owned extension --
# same command signature as makeitem, plus pickup-priority character
# ids so the Exp Card is bound to the killer for the standard
# item_first_get_time window from battle.conf. Off, makeitemowned
# returns failure and the mod's OnNPCKillEvent logs a one-line
# error per kill; nothing else on the mod is affected.
#
# The build lands this file at db/import/extension_db.yml (see
# stack/src/mods.rs: mods' db/ folders are mounted at rAthena's
# db/import), and db/extension_db.yml's Footer imports that path.
Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: makeitem_owned
    Enabled: true
