# Exp Cards -- two tiered families in the 30000+ custom range that no client
# update will collide with. Dropped by npc/exp_card.txt on a small chance
# from any mob kill, bound to the killer via makeitemowned.
#
# Ids are laid out in two contiguous ranges so the on-kill script can pick
# an item by simple arithmetic (base id + level):
#
#   30051..30060  Base_Exp_Card_1  .. Base_Exp_Card_10   -- grant BASE exp
#   30061..30070  Job_Exp_Card_1   .. Job_Exp_Card_10    -- grant JOB exp
#
# Calibration: a Level 10 card grants ~5% of the exp a Renewal character
# needs from level 98 to 99 (~1.25M in db/re/job_exp.yml, first jobs
# group -> 5% is roughly 60,000). Lower levels scale down linearly at
# 6,000 base exp per level:
#
#   Lv 1 -> 6,000     Lv 6  -> 36,000
#   Lv 2 -> 12,000    Lv 7  -> 42,000
#   Lv 3 -> 18,000    Lv 8  -> 48,000
#   Lv 4 -> 24,000    Lv 9  -> 54,000
#   Lv 5 -> 30,000    Lv 10 -> 60,000
#
# Job cards use the same numbers on the job axis. Class-specific curves
# differ, but 60,000 job exp at job level ~60 is in the same
# neighbourhood of "one meaningful chunk of the next level". If you want
# a different curve, edit the numbers below -- one file, twenty scripts.
#
# Version 3 is the ITEM_DB version this build reads; take it from the
# header of vendor/rathena/db/import-tmpl/item_db.yml if you retarget.
Header:
  Type: ITEM_DB
  Version: 3

Body:
  # -- Base Exp Cards ------------------------------------------------------
  - Id: 30051
    AegisName: Base_Exp_Card_1
    Name: Base Exp Card Lv1
    Type: Usable
    Buy: 0
    Weight: 1
    Script: |
