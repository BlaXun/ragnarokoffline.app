# Turn on the "blaze_shield_knockback" extension (registered in the
# fork's db/extension_db.yml). The gated code is in skill.cpp's
# post-dmg-calc switch and sets dmg.blewcount = 1 on every NJ_KAENSIN
# pillar hit, so skill_attack_blow then pushes the target one cell
# back along its approach line -- the same mechanic Fire Wall uses.

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: blaze_shield_knockback
    Enabled: true
